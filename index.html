<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO: Search engines read these to understand your page -->
  <title>Your Name | Portfolio</title>
  <meta name="description" content="A brief description of your awesome project or portfolio.">

  <!-- Typography: Importing 'Inter' from Google Fonts for a premium look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- CSS: Link to your stylesheet (make sure you have a style.css file) -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Navigation Bar -->
  <header>
    <nav>
      <div class="logo">NeilKim</div>
      <ul class="nav-links" id="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <div class="nav-actions">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
        <button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle navigation">☰</button>
      </div>
    </nav>
  </header>

  <!-- Main Content Area -->
  <main>

    <!-- Hero Section: The first thing visitors see -->
    <section id="hero" class="hero">
      <h1>Hello, I'm <span class="highlight">Neil Kim</span></h1>
      <p>I build elegant and dynamic web applications.</p>
      <a href="#projects" class="btn-primary">View My Work</a>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="projects-section">
      <h2 class="section-title">Projects</h2>

      <div class="projects-grid">
        <!-- Project 1 -->
        <div class="project-card">
          <div class="project-image">
            <!-- Ensure your image file is named 'project1.jpg' and is in the same folder -->
            <img src="project1.jpg" alt="Concert Merch Poster Scan">
          </div>
          <div class="project-content">
            <h3>Project 1</h3>
            <p>I created a large format print by scanning concert merch and transforming it into a poster through photoshop.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Neil Kim. Built with HTML & CSS.</p>
  </footer>

  <!-- JavaScript: Link to your logic scripts at the bottom for faster page load -->
  <script src="script.js"></script>
</body>

</html>
